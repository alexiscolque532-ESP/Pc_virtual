name: VM‑PC‑Gamer‑Windows10
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pc-gamer_win10:
    runs-on: [self‑hosted, windows, gpu‑rtx4070]
    env:
      CPU_CORES: 8
      RAM_GB: 32
      GPU_MODE: "RTX4070‑fisica"
    steps:
      - name: Verificar GPU y sistema
        run: |
          nvidia‑smi
          echo "=== Configuración PC Gamer RTX 4070 ==="
          echo "CPU: ${{ env.CPU_CORES }} núcleos"
          echo "RAM: ${{ env.RAM_GB }} GB"
        shell: pwsh

      - name: Instalar herramientas y drivers
        run: |
          Set‑ExecutionPolicy Bypass ‑Scope Process ‑Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12; iex ((New‑Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          choco install ‑y directx vcredist‑all nvidia‑driver
        shell: pwsh

      - name: Comprobación final
        run: |
          echo "✅ Entorno con RTX 4070 listo (solo para tu runner propio)"
          systeminfo
        shell: pwsh
