name: VM‑PC‑Gamer Windows10
on:
  push:
    branches: [ main ]
  workflow_dispatch: # Ejecutar manualmente desde Actions

jobs:
  pc‑gamer‑win10:
    runs-on: windows-latest
    env:
      CPU_CORES: 8
      RAM_GB: 16
      GPU_MODE: "habilitada‑emulada" # ⚠️ No es GPU real para juegos
    steps:
      - name: Ver sistema operativo
        run: |
          [Environment]::OSVersion
          echo "=== Configuración estilo PC Gamer ==="
          echo "CPU: ${{ env.CPU_CORES }} núcleos"
          echo "RAM: ${{ env.RAM_GB }} GB"
        shell: pwsh

      - name: Instalar herramientas básicas (chocolatey)
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12; iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        shell: pwsh

      - name: Instalar drivers y utilidades de rendimiento
        run: |
          choco install -y directx vcredist-all nvidia‑driver
        shell: pwsh

      - name: Comprobación final del entorno
        run: |
          echo "✅ Entorno Windows 10 estilo PC‑gamer listo (solo para pruebas, NO para jugar)"
          systeminfo
        shell: pwsh
